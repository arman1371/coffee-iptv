# SonarQube Project Configuration
sonar.projectKey=arman1371_coffee-iptv
sonar.projectName=Coffee IPTV
sonar.organization=arman1371

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/test-setup.ts,**/vite-env.d.ts,**/webos-types.d.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test-setup.ts

# TypeScript specific
sonar.typescript.tsconfigPath=tsconfig.json

# Source encoding
sonar.sourceEncoding=UTF-8
